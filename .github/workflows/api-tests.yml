name: API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to run tests against
        required: true
        default: main
        type: string
      test_tag:
        description: Test tag to run
        required: true
        default: '@regression'
        type: choice
        options:
          - '@regression'
          - '@healthcheck'
          - '@auth'
          - '@createbooking'
          - '@getbooking'
          - '@getbookingids'
          - '@updatebooking'
          - '@patchbooking'
          - '@deletebooking'

jobs:
  test:
    name: Playwright API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Create .env from secrets
        run: |
          cat <<EOF > .env
          BASE_URL=${{ secrets.BASE_URL }}
          API_USERNAME=${{ secrets.API_USERNAME }}
          API_PASSWORD=${{ secrets.API_PASSWORD }}
          API_INVALID_USERNAME=${{ secrets.API_INVALID_USERNAME }}
          API_INVALID_PASSWORD=${{ secrets.API_INVALID_PASSWORD }}
          EOF

      - name: Run API tests
        run: npx playwright test --grep "${{ github.event_name == 'workflow_dispatch' && inputs.test_tag || '@regression' }}"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
