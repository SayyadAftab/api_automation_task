name: API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to run tests against
        required: true
        default: main
        type: string
      test_suite:
        description: Test suite to run
        required: true
        default: all
        type: choice
        options:
          - all
          - ping
          - auth
          - booking

jobs:
  test:
    name: Playwright API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Run API tests
        run: |
          case "${{ github.event_name == 'workflow_dispatch' && inputs.test_suite || 'all' }}" in
            ping)    npm run test:ping ;;
            auth)    npm run test:auth ;;
            booking) npm run test:booking ;;
            *)       npm test ;;
          esac
        env:
          BASE_URL: https://restful-booker.herokuapp.com
          API_USERNAME: admin
          API_PASSWORD: password123

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
